<!DOCTYPE html>
<!--
    Sticky notes playground: a mock NCKU Moodle course page.
    Serve the repo root over HTTP (e.g. `python3 -m http.server`) and open
    http://localhost:8000/dev/notes-playground.html  (add ?lang=en for English).
    Alt + right-click = "Add sticky note here". Open two tabs to see syncing.
-->
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title>課程: 1141 程式設計 (二) | NCKU Moodle (playground)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { padding-top: 60px; background: #f2f2f2; }
        .navbar { height: 50px; }
        .iconset { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .iconset .btn { width: 150px; white-space: normal; font-size: 13px; }
        .iconset a { color: inherit; text-decoration: none; }
        .section { background: #fff; border-radius: 4px; margin-bottom: 16px; padding: 12px 16px; }
        .section.collapsed .content { display: none; }
        .activity { padding: 8px 0; border-bottom: 1px solid #eee; }
        #drawer { width: 260px; background: #fff; border-right: 1px solid #ddd; }
        body.drawer-closed #drawer { display: none; }
        .toolbar { position: fixed; right: 12px; bottom: 12px; z-index: 5; }
    </style>
</head>

<body id="page-course-view-topics" class="format-topics path-course course-4242 drawer-open">
    <nav class="navbar fixed-top navbar-dark bg-dark">
        <span class="navbar-brand">NCKU Moodle (playground)</span>
        <button class="btn btn-sm btn-outline-light" id="toggle-drawer">切換側欄</button>
    </nav>

    <div class="d-flex">
        <aside id="drawer" class="p-3">
            <p class="text-muted">側邊欄（切換寬度會改變版面）</p>
        </aside>

        <main id="region-main" class="flex-fill p-4">
            <nav aria-label="Navigation bar">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a href="https://moodle.ncku.edu.tw/">首頁</a></li>
                    <li class="breadcrumb-item"><a href="https://moodle.ncku.edu.tw/course/index.php">課程</a></li>
                    <li class="breadcrumb-item"><a href="https://moodle.ncku.edu.tw/course/view.php?id=4242" title="1141_程式設計(二) PROGRAMMING (II)">1141_F720100_1</a></li>
                </ul>
            </nav>
            <script>
                // ?page=assign mimics an assignment page's deeper breadcrumb
                if (new URLSearchParams(location.search).get('page') === 'assign') {
                    document.querySelector('.breadcrumb').insertAdjacentHTML('beforeend', `
                        <li class="breadcrumb-item"><a href="https://moodle.ncku.edu.tw/course/view.php?id=4242#section-1">作業繳交區</a></li>
                        <li class="breadcrumb-item"><a href="https://moodle.ncku.edu.tw/mod/assign/view.php?id=1219110" title="作業">Chapter 3 習題</a></li>`);
                }
            </script>

            <div class="iconset">
                <div class="btn btn-secondary">
                    <a role="button" href="#" title="個人化首頁(Dashboard)">
                        <div class="navicon" align="center"><i class="fa fa-3x fa-home"></i></div>
                        個人化首頁(Dashboard)
                    </a>
                </div>
                <div class="btn btn-secondary">
                    <a role="button" href="#" title="使用教學(Manual)">
                        <div class="navicon" align="center"><i class="fa fa-3x fa-book"></i></div>
                        使用教學(Manual)
                    </a>
                </div>
            </div>

            <ul class="list-unstyled">
                <li id="section-0" class="section">
                    <h3>一般</h3>
                    <div class="content">
                        <div id="module-100" class="activity"><i class="fa fa-comments"></i> 課程公告</div>
                        <div id="yui_3_17_2_1_1761400000000_55" class="activity">（隨機 id 的元素，不應被當成錨點）</div>
                    </div>
                </li>
                <li id="section-1" class="section">
                    <h3>第 1 週 <button class="btn btn-sm btn-link toggle">收合 / 展開</button></h3>
                    <div class="content">
                        <div id="module-101" class="activity"><i class="fa fa-file-text"></i> 作業一：Hello World（繳交期限 10/31）</div>
                        <div id="module-102" class="activity"><i class="fa fa-file-pdf-o"></i> 第一週講義.pdf</div>
                    </div>
                </li>
                <li id="section-2" class="section">
                    <h3>第 2 週 <button class="btn btn-sm btn-link toggle">收合 / 展開</button></h3>
                    <div class="content">
                        <div id="module-201" class="activity"><i class="fa fa-file-text"></i> 作業二：Linked List</div>
                        <div id="module-202" class="activity"><i class="fa fa-question-circle"></i> 小考一</div>
                    </div>
                </li>
            </ul>
            <div style="height: 1200px"></div>
        </main>
    </div>

    <div class="toolbar">
        <button class="btn btn-sm btn-danger" id="reset">清除所有便利貼</button>
    </div>

    <script>
        document.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () =>
            b.closest('.section').classList.toggle('collapsed')));
        document.getElementById('toggle-drawer').addEventListener('click', () => {
            document.body.classList.toggle('drawer-closed');
        });
        document.getElementById('reset').addEventListener('click', () => {
            localStorage.removeItem('ncku-shim-storage');
            location.reload();
        });
    </script>
    <script src="chrome-shim.js"></script>
    <script src="../src/markdown.js"></script>
    <script src="../src/sticky_notes.js"></script>
</body>

</html>
